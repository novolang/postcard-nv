[package]
name        = "postcard-nv"
version     = "0.1.0"
description = "The compact serde wire format: zigzag varint integers, length-prefixed strings and sequences, and no schema on the wire.  A struct is its members end to end with nothing between them.  A writer for the standard library's Serialize trait, and a put/take pair over a Cursor for every part of the format."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: arithmetic over bytes the caller already holds.  No function
# declares an effect.
#
# It carries no `tests/embedded_probe.nv` and does not build for a
# device: the surface speaks `Bytes`, `Str` and `Result`, and none of
# the three links at `@tier(embedded)` today.  The device packages of
# the deferred-logging stack are rzcobs-nv, bbqueue-nv and heapless-nv;
# this is the payload beside them, on the host.
layer       = "core"

category    = "encoding"

tags        = ["postcard", "serde", "varint", "leb128", "zigzag", "wire-format", "defmt", "deferred-logging", "sans-io"]
repository  = "https://github.com/novolang/postcard-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

[docs.pages]
"README.md" = "A typed payload in as few bytes as the values need"

[dependencies]
# postcard's integers are LEB128 and ZigZag, so they are declared rather
# than written again.  Both are `core`, which is what a `core` package
# may depend on.
leb128-nv = "^0.1.5"
zigzag-nv = "^0.1.4"
